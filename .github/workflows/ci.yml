name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check and Android build (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew check :androidApp:assembleDebug :desktopApp:compileKotlin

  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew.bat :core:desktopTest :desktopApp:packageMsi
      - uses: actions/upload-artifact@v7
        with:
          name: foursight-msi
          path: desktopApp/build/compose/binaries/main/msi/*.msi
          retention-days: 14
